# Kubernetes deployment sketch (NOT production-ready — illustrative only).
# Assumes Postgres and Artemis run as separate services/StatefulSets or managed offerings,
# and that secrets are provided via a Secret (not inline as below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: order-service
          image: registry.example.ch/order-service:0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres:5432/orders
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: order-secrets, key: db-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: order-secrets, key: db-password } }
            - name: ARTEMIS_URL
              value: tcp://artemis:61616
            - name: ARTEMIS_USER
              valueFrom: { secretKeyRef: { name: order-secrets, key: mq-user } }
            - name: ARTEMIS_PASSWORD
              valueFrom: { secretKeyRef: { name: order-secrets, key: mq-password } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8080

