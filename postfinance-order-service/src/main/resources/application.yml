spring:
  application:
    name: order-service

  # --- Default datasource: in-memory H2 (zero setup for reviewers) ---
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update          # demo convenience; use Flyway/Liquibase in production
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console

  # --- Messaging: embedded Artemis broker (self-contained demo) ---
  artemis:
    mode: embedded
    embedded:
      enabled: true
      queues: order.created

# --- Observability ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service

logging:
  level:
    ch.example.orderservice: INFO
    org.springframework.jms: INFO

