services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  artemis:
    image: apache/activemq-artemis:2.33.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      - "61616:61616"   # JMS
      - "8161:8161"     # web console

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      artemis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      ARTEMIS_URL: tcp://artemis:61616
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      - "8080:8080"

